id: permission-editor-read
name: Editor Read Demo
version: 1.0
description: Adds a line word-count action that only reads editor text.
graptos_api_version: 1
enabled: false

permissions:
  - editor.read

contributes:
  commands:
    - line-word-count
  menus:
    - editor-line:Count Words On This Line:line-word-count
