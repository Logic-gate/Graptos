name: QML Demo
extensions: [.qml]
line_comment: "//"
auto_indent: true
indent_openers: ["{"]
indent_closers: ["}"]
close_pairs: ["(=>)", "{=>}", "[=>]", "\"=>\""]
icon: qml
filenames: []
index: true
import_style: none
lsp_command:
lsp_language_id: qml
lsp_args: []
import_keywords: [import]
import_from_keywords: []
import_member_keywords: []
import_roots: [.]
import_env: []
import_extensions: [.qml, .js]
import_member_files: []
import_strip_extensions: true
import_dot_modules: false
import_static_modules: []
completions: [import, Item, Rectangle, Text, Image, MouseArea, property, signal, function, anchors, parent, width, height, color]
line_close_pairs: []
statement_required_enders: []
statement_exempt_prefixes: ["//", "import", "property", "signal"]
statement_exempt_suffixes: ["{", "}", ";"]
formatting:
  enabled: false
  scope: selection_or_block
  profile: brace_semicolon
  block_style: braces
  statement_style: semicolon
  brace_style: attach
  one_statement_per_line: false
  space_before_block_opener: true
  space_after_comma: true
  space_after_control_keyword: true
  space_around_binary_operators: true
  space_around_logical_operators: true
  logical_operators: ["&&", "||"]
  binary_operators: ["=", ":", "+", "-", "*", "/"]
  unary_prefix_operators: ["!"]
  protected_scopes: [comment, string]
  pointer_alignment: name
  continuation_indent: 4
  max_column: 100
  wrap_after_comma: false
  case_indent: 0
  preserve_blank_lines: true
  max_blank_lines: 1
  collapse_empty_blocks: false
rules:
  - name: comment
    scope: comment
    pattern: "//.*$"
    color: "#6A9955"
  - name: string
    scope: string
    pattern: "\"(?:\\\\.|[^\"\\\\])*\"|'(?:\\\\.|[^'\\\\])*'"
    color: "#CE9178"
  - name: keyword
    pattern: "(?<![A-Za-z0-9_])(import|property|signal|function|readonly|alias|on|if|else|for|while|return|true|false)(?![A-Za-z0-9_])"
    color: "#569CD6"
    bold: true
  - name: type
    pattern: "(?<![A-Za-z0-9_])(Item|Rectangle|Text|Image|MouseArea|Column|Row|ListView|Repeater)(?![A-Za-z0-9_])"
    color: "#4EC9B0"
  - name: number
    pattern: "(?<![A-Za-z0-9_])-?[0-9]+(\\.[0-9]+)?(?![A-Za-z0-9_])"
    color: "#B5CEA8"
