name: Todo List
extensions: [.todo]
line_comment: "#"
auto_indent: false
indent_openers: []
indent_closers: []
close_pairs: ["(=>)", "{=>}", "[=>]"]
icon: todo
filenames: []
index: false
import_style: none
lsp_command:
lsp_language_id:
lsp_args: []
import_keywords: []
import_from_keywords: []
import_member_keywords: []
import_roots: []
import_env: []
import_extensions: []
import_member_files: []
import_strip_extensions: true
import_dot_modules: false
import_static_modules: []
completions: [TODO, DONE, WAITING, BLOCKED, NOTE, TODAY]
line_close_pairs: []
statement_required_enders: []
statement_exempt_prefixes: ["#", "-", "*", "TODO", "DONE", "WAITING", "BLOCKED", "NOTE"]
statement_exempt_suffixes: []
formatting:
  enabled: false
  scope: selection_or_block
  profile: none
  block_style: none
  statement_style: newline
  brace_style: attach
  one_statement_per_line: false
  space_before_block_opener: false
  space_after_comma: true
  space_after_control_keyword: true
  space_around_binary_operators: true
  space_around_logical_operators: true
  logical_operators: []
  binary_operators: []
  unary_prefix_operators: []
  protected_scopes: [comment]
  pointer_alignment: name
  continuation_indent: 2
  max_column: 100
  wrap_after_comma: false
  case_indent: 0
  preserve_blank_lines: true
  max_blank_lines: 1
  collapse_empty_blocks: false
rules:
  - name: comment
    scope: comment
    pattern: "#.*$"
    color: "#6A9955"
  - name: done
    pattern: "^[[:space:]]*DONE\\b.*$"
    color: "#57CC99"
    bold: true
  - name: todo
    pattern: "^[[:space:]]*TODO\\b.*$"
    color: "#F9C74F"
    bold: true
  - name: waiting
    pattern: "^[[:space:]]*(WAITING|BLOCKED)\\b.*$"
    color: "#FF6B6B"
    bold: true
  - name: note
    pattern: "^[[:space:]]*NOTE\\b.*$"
    color: "#89B4FA"
  - name: tag
    pattern: "@[A-Za-z0-9_-]+"
    color: "#CBA6F7"
  - name: date
    pattern: "[0-9]{4}-[0-9]{2}-[0-9]{2}"
    color: "#B5CEA8"
