name: Full Demo Log
extensions: [.fulldemo]
line_comment: "#"
auto_indent: false
indent_openers: []
indent_closers: []
close_pairs: ["(=>)", "{=>}", "[=>]"]
icon: demo
filenames: []
index: false
import_style: none
lsp_command:
lsp_language_id:
lsp_args: []
import_keywords: []
import_from_keywords: []
import_member_keywords: []
import_roots: []
import_env: []
import_extensions: []
import_member_files: []
import_strip_extensions: true
import_dot_modules: false
import_static_modules: []
completions: [INFO, WARN, ERROR, TODO]
line_close_pairs: []
statement_required_enders: []
statement_exempt_prefixes: ["#", "INFO", "WARN", "ERROR", "TODO"]
statement_exempt_suffixes: []
formatting:
  enabled: false
  scope: selection_or_block
  profile: none
  block_style: none
  statement_style: newline
  brace_style: attach
  one_statement_per_line: false
  space_before_block_opener: false
  space_after_comma: true
  space_after_control_keyword: true
  space_around_binary_operators: true
  space_around_logical_operators: true
  logical_operators: []
  binary_operators: []
  unary_prefix_operators: []
  protected_scopes: [comment]
  pointer_alignment: name
  continuation_indent: 2
  max_column: 100
  wrap_after_comma: false
  case_indent: 0
  preserve_blank_lines: true
  max_blank_lines: 1
  collapse_empty_blocks: false
rules:
  - name: comment
    scope: comment
    pattern: "#.*$"
    color: "#6A9955"
  - name: error
    pattern: "^ERROR\\b.*$"
    color: "#FF6B6B"
    bold: true
  - name: warn
    pattern: "^WARN\\b.*$"
    color: "#F9C74F"
    bold: true
  - name: info
    pattern: "^INFO\\b.*$"
    color: "#57CC99"
